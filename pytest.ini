[pytest]
testpaths = tests
addopts = -v --html=reportes/reporte.html --self-contained-html --alluredir=reportes/allure-results
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
log_file = reportes/ejecucion.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
markers =
    humo: pruebas rápidas del flujo principal
